// break Oura line at gaps > 5 min
function withGaps(xs,ys,maxgap){
  const ox=[],oy=[];
  for(let i=0;i<xs.length;i++){
    if(i>0){
      const dt=(new Date(xs[i]) - new Date(xs[i-1]))/1000;
      if(dt>maxgap){ ox.push(xs[i-1]); oy.push(null); }
    }
    ox.push(xs[i]); oy.push(ys[i]);
  }
  return [ox,oy];
}
